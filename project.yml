name: BigKeyboard
options:
  bundleIdPrefix: org.domyweb
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.9
targets:
  BigKeyboard:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 三星風鍵盤
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.bigkeyboard
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: KeyboardExtension
        embed: true
  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExtension
        excludes:
          - "Engine/Vendor/McBopomofo/LICENSE.txt"
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: 三星風鍵盤
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            PrimaryLanguage: zh-Hant
            IsASCIICapable: false
            PrefersRightToLeft: false
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.bigkeyboard.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
        SWIFT_OBJC_BRIDGING_HEADER: KeyboardExtension/Engine/Bridge/BridgingHeader.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/KeyboardExtension/Engine/Vendor/McBopomofo
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        GCC_WARN_INHIBIT_ALL_WARNINGS: "YES"
