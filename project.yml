name: BigKeyboard
options:
  bundleIdPrefix: org.domyweb
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # 沒有語系檔時系統照這個語言顯示日期、時間（例如「2 分鐘前」）；沒設會是英文
  developmentLanguage: zh-Hant
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.9
targets:
  BigKeyboard:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      # Domy 設計系統的代號（從 domy-design 產生的檔，不手改）。只給 App 用：鍵盤擴充不載入 SwiftUI
      - Design
      # 設定頁「開源授權」顯示的授權全文：直接用原始授權檔，不另抄一份
      - path: KeyboardExtension/Engine/Vendor/McBopomofo/LICENSE.txt
        buildPhase: resources
      - path: KeyboardExtension/Resources/LICENSE-AOSP-LatinIME.txt
        buildPhase: resources
      - path: KeyboardExtension/Resources/Fonts/OFL-NotoSerifTC.txt
        buildPhase: resources
      - path: KeyboardExtension/Resources/Fonts/OFL-LXGWWenKaiTC.txt
        buildPhase: resources
      - path: KeyboardExtension/Resources/KeySounds/CREDITS-KeySounds.txt
        buildPhase: resources
    entitlements:
      path: Entitlements/BigKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.domyweb.bigkeyboard
        # 字典 iCloud 同步（鍵值儲存）。只給 App；鍵盤擴充不碰 iCloud
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 豆鍵
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.bigkeyboard
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: KeyboardExtension
        embed: true
  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExtension
        excludes:
          - "Engine/Vendor/McBopomofo/LICENSE.txt"
      - Shared
    entitlements:
      path: Entitlements/KeyboardExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.domyweb.bigkeyboard
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: 豆鍵
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            # 改 mul 拿不掉小字，只會變「多種語言」；用 zh-Hant 顯示「中文」，系統聽寫也維持中文
            PrimaryLanguage: zh-Hant
            # 豆鍵有英文鍵面。寫 false 等於跟系統說「打不出英文」，要英文的輸入框（email、網址、帳號）系統就可能不把豆鍵列出來
            IsASCIICapable: true
            PrefersRightToLeft: false
            # 字典要讓鍵盤寫進 App 共用的資料夾，iOS 規定要開「允許完全取用」；鍵盤仍然不連網
            RequestsOpenAccess: true
        # 豆漿、紅豆主題的鍵帽字（Resources/Fonts）。App 不另放一份，從擴充裡借來註冊
        UIAppFonts:
          - NotoSerifTC-Medium.otf
          - LXGWWenKaiTC-Regular.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.bigkeyboard.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
        SWIFT_OBJC_BRIDGING_HEADER: KeyboardExtension/Engine/Bridge/BridgingHeader.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/KeyboardExtension/Engine/Vendor/McBopomofo
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        GCC_WARN_INHIBIT_ALL_WARNINGS: "YES"
