name: BigKeyboard
options:
  bundleIdPrefix: org.domyweb
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.9
targets:
  BigKeyboard:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    entitlements:
      path: Entitlements/BigKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.domyweb.bigkeyboard
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 豆鍵
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.bigkeyboard
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: KeyboardExtension
        embed: true
  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExtension
        excludes:
          - "Engine/Vendor/McBopomofo/LICENSE.txt"
      - Shared
    entitlements:
      path: Entitlements/KeyboardExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.domyweb.bigkeyboard
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: 豆鍵
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            # 多語言：切換鍵盤選單只顯示「豆鍵」，不帶「中文」小字
            PrimaryLanguage: mul
            IsASCIICapable: false
            PrefersRightToLeft: false
            # 字典要讓鍵盤寫進 App 共用的資料夾，iOS 規定要開「允許完全取用」；鍵盤仍然不連網
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.bigkeyboard.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
        SWIFT_OBJC_BRIDGING_HEADER: KeyboardExtension/Engine/Bridge/BridgingHeader.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/KeyboardExtension/Engine/Vendor/McBopomofo
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        GCC_WARN_INHIBIT_ALL_WARNINGS: "YES"
